<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODIN sign up form</title>
  <link rel="stylesheet" href="style.css">
</head>
    <div class="container">
        <img src="odinplant.avif" alt="">
        <div class="transparent">
            <img src="odin-lined.png" alt="">
            <h1>ODIN</h1>
        </div>  
    </div>
    
  <div class="content">
    <div class="header-text">
      <p>
        This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
        <br>
        Sign up now to get started.
        <br>
      </p>
      <p>
        You <span>know</span> you want to.
      </p>
    </div>

    <form>
      <fieldset>
        <legend>Let's do this!</legend>

        <div class="form-row">
          <div class="form-group"> 
              <label for="first-name">FIRST NAME</label>
              <input id="first-name" type="text" name="first-name"/>
          </div>
          <div class="form-group">
              <label for="last-name">LAST NAME</label>
              <input id="last-name" type="text" name="last-name"/>
                </div>
            </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">EMAIL</label>
                <input id="email" type="text" name="email" placeholder="example@gmail.com"> 
            </div>
            <div class="form-group">
                <label for="phone-number">PHONE NUMBER</label>
                <input id="phone-number" type="text" name="phone-number">  
                </div>
            </div>

        <div class="form-row">
            <div class="form-group">
                <label for="user-password">PASSWORD</label>
                <input id="user-password" type="password" name="password" required>  
            </div>
            <div class="form-group">
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input id="confirm-password" type="password" name="confirm-password" required>
            </div>        
        </div>    
      </fieldset>
      <button type="submit">Create Account</button>
      <p>Already have an account? <a href="#">Log in</a></p>
    </form>
  </div>
</body>
</html>
